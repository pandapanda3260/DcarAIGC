<!DOCTYPE html>
<!--
  ============================================================================
  Dcar Sentinel · 登录页（纯页面 + UI，不包含任何账号验证逻辑）
  ============================================================================
  已接线：本页是 dcar_auth.gateway（src/dcar_eval/dcar_auth/gateway.py）的
  登录模板。网关把本页挂在 <base>/login（本地 base 为空 → /login；服务器
  设 DCAR_AUTH_BASE_PATH=/dcar → /dcar/login），页面从自身地址推导 base，
  两种形态无需改动。同一张卡片内有三个视图（登录 / 注册 / 找回密码），
  只切换显示，不改 URL。

  网关合同（全部 POST，application/x-www-form-urlencoded，必须携带同源
  标记头 X-Dcar-Request，成功 200 JSON，失败 JSON {"detail": 中文}）：
    - /auth/login          marker login        username/password/remember/return_to → {redirect_to}
    - /auth/code           marker code         phone/purpose(register|login|reset) → {}
    - /auth/login/code     marker login-code   phone/code/remember/return_to → {redirect_to}
    - /auth/register       marker register     username/phone/password/code/return_to → {redirect_to}
    - /auth/reset/verify   marker reset-verify phone/code → {reset_token}
    - /auth/reset/confirm  marker reset-confirm reset_token/password/return_to → {redirect_to}
    - 会话探活 GET <base>/auth/session（已登录 200，未登录 401）
    - 未登录访问受保护页 → 302 <base>/login?return_to=<原路径>
  新接口的失败响应还带 code 字段，页面只展示 detail。

  直接以 file:// 打开 → 自动进入本地预览模式，不发送任何数据。
  账号、密码哈希与验证码由网关的 SQLite 账号库管理；本页面只负责界面与提交。
  设计令牌与 app/web/app/globals.css 保持一致（navy/#102c35、品牌黄/#ffcd32、
  荧光绿/#d9ff57、teal/#0d8a7b、ink/#13262d）。
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · Dcar AIGC 内容运营工作台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='23' fill='%23FFCD32'/%3E%3Cpath fill='%231F2129' transform='translate(13.474 18.823) scale(2)' d='M18.2686593 14.6178535C14.4475074 14.6128432 10.6889837 15.0545804 7.03149996 15.9313744 8.11287927 10.7157025 12.746527 6.78641265 18.2774273 6.7935009H18.3262772C23.8342138 6.82357201 28.4340424 10.7557845 29.4991384 15.9580958 25.8449948 15.0729513 22.0889762 14.6224462 18.2686593 14.6178535M18.3638541.000444331963C18.3379678.0000133906399 18.3112465.0000133906399 18.2853602.0000133906399 8.21517191-.0120812971.0125549476 8.17049466.000014624874 18.2406829-.00623349602 23.2158628 1.98993426 27.7334397 5.22363416 31.0343605L10.2334683 26.4416298C9.21346455 25.439997 8.38134526 24.2483921 7.78971804 22.9273558 11.1854161 22.0338609 14.6900871 21.5825208 18.2598914 21.5871135 21.8296957 21.5912887 25.3322791 22.0509793 28.7250545 22.9528246 28.1167264 24.3022523 27.2566332 25.5155683 26.2023928 26.5284742L31.1633769 31.1775701C34.469308 27.8753968 36.5197535 23.3160678 36.5260298 18.2853577 36.5381244 8.24147322 28.3985531.0551395789 18.3638541.000444331963'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #13262d;
    --muted: #68777d;
    --line: #dfe6e8;
    --paper: #ffffff;
    --navy: #102c35;
    --navy-2: #173e48;
    --dcd-brand: #ffcd32;
    --dcd-on-brand: #1f2129;
    --lime: #d9ff57;
    --teal: #0d8a7b;
    --teal-soft: #e3f3ef;
    --orange: #e4743b;
    --red: #c84c4c;
    --red-soft: #fdecec;
    --focus-ring: 0 0 0 4px rgba(13, 138, 123, .16);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 82% 12%, rgba(217, 255, 87, .2), transparent 33%),
      radial-gradient(circle at 8% 92%, rgba(13, 138, 123, .22), transparent 34%),
      linear-gradient(130deg, var(--navy) 0%, #143540 52%, var(--navy-2) 100%);
    background-attachment: fixed;
  }
  button, input { font: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

  /* 背景网格点缀：极淡，向中心渐隐 */
  .stage::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, transparent 26%, #000 78%);
            mask-image: radial-gradient(circle at 50% 42%, transparent 26%, #000 78%);
    pointer-events: none;
  }

  .stage {
    min-height: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 40px 20px calc(26px + env(safe-area-inset-bottom));
  }

  /* ---- 登录卡片 ---- */
  .card {
    position: relative;
    width: min(420px, 100%);
    padding: 38px 42px 32px;
    border-radius: 18px;
    background: var(--paper);
    box-shadow: 0 24px 70px rgba(4, 16, 21, .45), 0 2px 8px rgba(4, 16, 21, .25);
    animation: card-in .45s cubic-bezier(.22, .8, .3, 1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .brand-mark {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 11px;
    box-shadow: 0 4px 14px rgba(31, 33, 41, .22);
  }
  .brand strong { display: block; font-size: 16px; letter-spacing: .2px; }
  .brand span   { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .preview-badge {
    margin-left: auto;
    align-self: flex-start;
    padding: 4px 8px;
    border: 1px solid #f2ddb0;
    border-radius: 999px;
    background: #fdf6e3;
    color: #9a6b1f;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
  }

  .welcome h1 { margin: 0; font-size: 22px; letter-spacing: -.4px; }

  form { margin-top: 24px; }

  .field { margin-bottom: 16px; }
  #password-field { margin-bottom: 10px; }
  .field label {
    display: inline-block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 750;
    color: #3c4f56;
  }
  .hint-link {
    border: 0; padding: 0;
    background: transparent;
    color: var(--teal);
    font-size: 11px;
    font-weight: 750;
  }
  .hint-link:hover { text-decoration: underline; }
  .hint-link:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 3px; }

  .control { position: relative; }
  .control .lead-icon {
    position: absolute;
    left: 13px; top: 50%;
    width: 17px; height: 17px;
    transform: translateY(-50%);
    color: #93a1a6;
    pointer-events: none;
  }
  .control input {
    width: 100%;
    height: 46px;
    padding: 0 44px 0 40px;
    border: 1px solid #cad5d8;
    border-radius: 10px;
    outline: none;
    background: #fbfcfc;
    color: var(--ink);
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .control input::placeholder { color: #9fadb2; }
  .control input:hover { border-color: #adbcc0; }
  .control input:focus {
    border-color: var(--teal);
    background: #fff;
    box-shadow: var(--focus-ring);
  }
  .field.invalid .control input { border-color: var(--red); background: #fffbfb; }
  .field.invalid .control input:focus { box-shadow: 0 0 0 4px rgba(200, 76, 76, .13); }
  #username, #reg-username, #login-phone, #reg-phone, #reset-phone { padding-right: 14px; }
  .control input.has-action { padding-right: 118px; }

  /* 验证码输入框内嵌的“获取验证码”按钮：倒计时即反馈 */
  .code-btn {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    height: 34px;
    padding: 0 10px;
    border: 0; border-radius: 8px;
    background: transparent;
    color: var(--teal);
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .code-btn:hover:not(:disabled) { background: #eef2f3; }
  .code-btn:disabled { color: #9fadb2; cursor: default; }
  .code-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

  .pw-toggle {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    display: grid; place-items: center;
    width: 34px; height: 34px;
    border: 0; border-radius: 8px;
    background: transparent;
    color: #8b999e;
    transition: background .15s ease, color .15s ease;
  }
  .pw-toggle:hover { background: #eef2f3; color: #4a5c62; }
  .pw-toggle:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .pw-toggle svg { width: 19px; height: 19px; }

  .field-msg {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    margin: 7px 2px 0;
    font-size: 11px;
    line-height: 1.5;
  }
  .field-msg svg { width: 13px; height: 13px; flex: 0 0 13px; margin-top: 1px; }
  .field-msg.error { color: #b04a4a; }
  .field-msg.caps  { color: #b05f2e; }
  [hidden] { display: none !important; }

  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 18px;
  }
  .remember {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #4a5c62;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    user-select: none;
  }
  .remember input {
    width: 17px; height: 17px;
    margin: 0;
    accent-color: var(--navy);
    cursor: pointer;
  }
  .remember input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---- 全局提示条（错误 / 信息）---- */
  .banner {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 0 16px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.6;
  }
  .banner svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 1px; }
  .banner.error { background: var(--red-soft); border: 1px solid #f0cfcf; color: #a74343; }
  .banner.info  { background: #edf8f5; border: 1px solid #bfded7; color: #176e63; }

  .submit {
    position: relative;
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--navy);
    border-radius: 10px;
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 750;
    letter-spacing: 2px;
    box-shadow: 0 7px 18px rgba(16, 44, 53, .28);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .submit:hover { transform: translateY(-1px); background: #16414f; box-shadow: 0 9px 22px rgba(16, 44, 53, .34); }
  .submit:active { transform: none; }
  .submit:focus-visible { outline: 3px solid rgba(13, 138, 123, .55); outline-offset: 2px; }
  .submit:disabled { cursor: not-allowed; opacity: .72; transform: none; box-shadow: none; }
  .submit .spinner {
    display: none;
    width: 16px; height: 16px;
    margin-right: 9px;
    vertical-align: -3px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .submit.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .links-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .links-row .dot { color: #b7c2c6; }

  .page-foot {
    color: #8eabb2;
    font-size: 11px;
    letter-spacing: .3px;
    text-align: center;
  }
  .page-foot .dot { margin: 0 7px; opacity: .55; }

  @media (max-width: 480px) {
    .stage { padding: 28px 16px calc(20px + env(safe-area-inset-bottom)); gap: 20px; }
    .card { padding: 30px 24px 26px; border-radius: 16px; }
    .welcome h1 { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .submit, .control input, .pw-toggle { transition: none; }
    .submit .spinner { animation-duration: 1.4s; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="login-title">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="懂车帝 App">
        <rect width="100" height="100" rx="23" fill="#FFCD32"/>
        <path fill="#1F2129" transform="translate(13.474 18.823) scale(2)" d="M18.2686593 14.6178535C14.4475074 14.6128432 10.6889837 15.0545804 7.03149996 15.9313744 8.11287927 10.7157025 12.746527 6.78641265 18.2774273 6.7935009H18.3262772C23.8342138 6.82357201 28.4340424 10.7557845 29.4991384 15.9580958 25.8449948 15.0729513 22.0889762 14.6224462 18.2686593 14.6178535M18.3638541.000444331963C18.3379678.0000133906399 18.3112465.0000133906399 18.2853602.0000133906399 8.21517191-.0120812971.0125549476 8.17049466.000014624874 18.2406829-.00623349602 23.2158628 1.98993426 27.7334397 5.22363416 31.0343605L10.2334683 26.4416298C9.21346455 25.439997 8.38134526 24.2483921 7.78971804 22.9273558 11.1854161 22.0338609 14.6900871 21.5825208 18.2598914 21.5871135 21.8296957 21.5912887 25.3322791 22.0509793 28.7250545 22.9528246 28.1167264 24.3022523 27.2566332 25.5155683 26.2023928 26.5284742L31.1633769 31.1775701C34.469308 27.8753968 36.5197535 23.3160678 36.5260298 18.2853577 36.5381244 8.24147322 28.3985531.0551395789 18.3638541.000444331963"/>
      </svg>
      <div>
        <strong>Dcar AIGC</strong>
        <span>开心瓦瓦·运营工作台</span>
      </div>
      <span class="preview-badge" id="preview-badge" hidden>本地预览</span>
    </header>

    <div class="welcome">
      <h1 id="login-title">欢迎回来</h1>
    </div>

    <!-- ===================== 登录 ===================== -->
    <form id="login-form" method="post" novalidate data-view="login">
      <div id="pw-block">
        <div class="field">
          <label for="username">账号</label>
          <div class="control">
            <svg class="lead-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="7" r="3"/><path d="M4.5 17c.6-3.1 2.6-4.8 5.5-4.8s4.9 1.7 5.5 4.8"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="请输入账号" aria-describedby="username-error">
          </div>
          <p class="field-msg error" id="username-error" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.6v4.2M10 13.6h.01"/></svg><span></span></p>
        </div>

        <div class="field" id="password-field">
          <label for="password">密码</label>
          <div class="control">
            <svg class="lead-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8.6" width="12" height="8" rx="2"/><path d="M6.8 8.6V6.4a3.2 3.2 0 0 1 6.4 0v2.2"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="caps-hint password-error">
            <button type="button" class="pw-toggle" data-target="password" aria-label="显示密码" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 10S5 4.9 10 4.9 17.8 10 17.8 10 15 15.1 10 15.1 2.2 10 2.2 10Z"/><circle cx="10" cy="10" r="2.4"/></svg>
              <svg class="eye-closed" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3.5 3.5l13 13"/><path d="M8.3 5.2A8.7 8.7 0 0 1 10 4.9c5 0 7.8 5.1 7.8 5.1a13.9 13.9 0 0 1-2.2 2.9M5.7 6.4A13 13 0 0 0 2.2 10S5 15.1 10 15.1a8 8 0 0 0 3.2-.66"/><path d="M8.3 8.5a2.4 2.4 0 0 0 3.3 3.3"/></svg>
            </button>
          </div>
          <p class="field-msg caps" id="caps-hint" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 2.6 16h14.8L10 3Z"/><path d="M10 8.4v3.2M10 14.4h.01"/></svg><span>大写锁定已开启，请注意密码大小写</span></p>
          <p class="field-msg error" id="password-error" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.6v4.2M10 13.6h.01"/></svg><span></span></p>
        </div>
      </div>

      <div id="code-block" hidden>
        <div class="field">
          <label for="login-phone">手机号</label>
          <div class="control">
            <svg class="lead-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="8" height="15" rx="1.8"/><path d="M9 14.6h2"/></svg>
            <input id="login-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入手机号" aria-describedby="login-phone-error">
          </div>
          <p class="field-msg error" id="login-phone-error" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.6v4.2M10 13.6h.01"/></svg><span></span></p>
        </div>
        <div class="field">
          <label for="login-code">验证码</label>
          <div class="control">
            <svg class="lead-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h13v10h-13z"/><path d="M3.5 6l6.5 5 6.5-5"/></svg>
            <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="has-action" placeholder="请输入验证码" aria-describedby="login-code-error">
            <button type="button" class="code-btn" data-phone="login-phone" data-purpose="login">获取验证码</button>
          </div>
          <p class="field-msg error" id="login-code-error" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.6v4.2M10 13.6h.01"/></svg><span></span></p>
        </div>
      </div>

      <div class="options-row">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" name="remember" checked>
          <span>保持登录</span>
        </label>
        <button type="button" class="hint-link" id="forgot-btn">忘记密码？</button>
      </div>

      <div class="banner" role="alert" hidden>
        <svg class="banner-icon-error" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6.4v4.4M10 13.9h.01"/></svg>
        <svg class="banner-icon-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" hidden><circle cx="10" cy="10" r="7.5"/><path d="M10 9.2v4.4M10 6.4h.01"/></svg>
        <span class="banner-text"></span>
      </div>

              <svg class="eye-closed" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3.5 3.5l13 13"/><path d="M8.3 5.2A8.7 8.7 0 0 1 10 4.9c5 0 7.8 5.1 7.8 5.1a13.9 13.9 0 0 1-2.2 2.9M5.7 6.4A13 13 0 0 0 2.2 10S5 15.1 10 15.1a8 8 0 0 0 3.2-.66"/><path d="M8.3 8.5a2.4 2.4 0 0 0 3.3 3.3"/></svg>

<script>
  "use strict";
  /* ==========================================================================
     接线：dcar_auth.gateway 合同（见文件头注释）。
     登录页固定挂在 <base>/login，据此从自身地址推导 base——
     本地 http://127.0.0.1:4173/login → base ""；
     服务器 https://<host>/dcar/login → base "/dcar"。
     以 file:// 直接打开本文件时自动进入预览模式：不发送任何请求，仅演示状态。
     ========================================================================== */
  var IS_PREVIEW = window.location.protocol === "file:";
  var BASE_PATH = IS_PREVIEW ? "" : window.location.pathname.replace(/\/login\/?$/, "");
  var SESSION_PROBE_ENDPOINT = IS_PREVIEW ? null : BASE_PATH + "/auth/session";
  var REDIRECT_FALLBACK = BASE_PATH + "/overview";
  var ENDPOINTS = {
    "login": "/auth/login",
    "code": "/auth/code",
    "login-code": "/auth/login/code",
    "register": "/auth/register",
    "reset-verify": "/auth/reset/verify",
    "reset-confirm": "/auth/reset/confirm"
  };
  var COUNTDOWN_SECONDS = 60;
  var PHONE_PATTERN = /^1[3-9][0-9]{9}$/;
  var CODE_PATTERN = /^[0-9]{6}$/;
  var USERNAME_PATTERN = /^[A-Za-z0-9_]{4,32}$/;

  var title = document.getElementById("login-title");
  var forms = {
    login: document.getElementById("login-form"),
    register: document.getElementById("register-form"),
    reset: document.getElementById("reset-form")
  };
  var TITLES = { login: "欢迎回来", register: "注册账号", reset: "找回密码" };
  var loginForm = forms.login;
  var usernameInput = document.getElementById("username");
  var passwordInput = document.getElementById("password");
  var capsHint = document.getElementById("caps-hint");
  var pwBlock = document.getElementById("pw-block");
  var codeBlock = document.getElementById("code-block");
  var loginModeToggle = document.getElementById("login-mode-toggle");
  var loginByCode = false;
  var resetStep1 = document.getElementById("reset-step1");
  var resetStep2 = document.getElementById("reset-step2");
  var resetToken = "";
  var countdowns = [];

  /* SVG 元素没有 HTMLElement 的 hidden 属性接口，统一用 attribute 切换显隐 */
  function setHidden(element, hidden) {
    if (hidden) element.setAttribute("hidden", "");
    else element.removeAttribute("hidden");
  }

  function byId(id) { return document.getElementById(id); }

  /* 以 file:// 直接打开时亮出"本地预览"角标，避免误以为是正式登录入口 */
  if (IS_PREVIEW) {
    byId("preview-badge").removeAttribute("hidden");
  }

  /* 已持有有效会话时直接进入工作台（网关在服务端也会做同样的跳转，这里
     兜底 bfcache/回退按钮场景）；探活失败则静默停留在登录页 */
  if (SESSION_PROBE_ENDPOINT) {
    fetch(SESSION_PROBE_ENDPOINT, { credentials: "include", cache: "no-store" })
      .then(function (response) {
        if (response.ok) window.location.replace(redirectTarget());
      })
      .catch(function () { /* 保持在登录页 */ });
  }

  /* ---- 显示 / 隐藏密码：不抢占输入框焦点 ---- */
  Array.prototype.forEach.call(document.querySelectorAll(".pw-toggle"), function (toggle) {
    var input = byId(toggle.getAttribute("data-target"));
    var eyeOpen = toggle.querySelector(".eye-open");
    var eyeClosed = toggle.querySelector(".eye-closed");
    toggle.addEventListener("mousedown", function (event) { event.preventDefault(); });
    toggle.addEventListener("click", function () {
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
      setHidden(eyeOpen, show);
      setHidden(eyeClosed, !show);
    });
  });

  /* ---- 大写锁定提示（仅登录密码框）---- */
  function updateCapsHint(event) {
    if (typeof event.getModifierState !== "function") return;
    capsHint.hidden = !event.getModifierState("CapsLock");
  }
  passwordInput.addEventListener("keydown", updateCapsHint);
  passwordInput.addEventListener("keyup", updateCapsHint);
  passwordInput.addEventListener("blur", function () { capsHint.hidden = true; });

  /* ---- 字段校验：仅前端格式检查，输入后即时恢复 ---- */
  function fieldOf(input) { return input.closest(".field"); }
  function setFieldError(input, message) {
    var field = fieldOf(input);
    var note = field.querySelector(".field-msg.error");
    field.classList.toggle("invalid", Boolean(message));
    note.querySelector("span").textContent = message || "";
    note.hidden = !message;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".field input"), function (input) {
    input.addEventListener("input", function () { setFieldError(input, ""); });
  });
  function requireValue(input, emptyMessage, pattern, formatMessage) {
    var value = input.type === "password" ? input.value : input.value.trim();
    if (!value) { setFieldError(input, emptyMessage); return false; }
    if (pattern && !pattern.test(value)) { setFieldError(input, formatMessage); return false; }
    setFieldError(input, "");
    return true;
  }
  function requirePassword(input) {
    var value = input.value;
    if (!value) { setFieldError(input, "请输入密码"); return false; }
    var length = Array.from(value).length;
    if (length < 8 || length > 64 || value.indexOf("\u0000") !== -1) { setFieldError(input, "密码长度需为 8–64 位"); return false; }
    setFieldError(input, "");
    return true;
  }
  function firstInvalid(inputs) {
    for (var index = 0; index < inputs.length; index += 1) {
      if (fieldOf(inputs[index]).classList.contains("invalid")) return inputs[index];
    }
    return null;
  }

  /* ---- 表单内提示条 ---- */
  function showBanner(form, kind, text) {
    var banner = form.querySelector(".banner");
    banner.hidden = false;
    banner.className = "banner " + kind;
    setHidden(banner.querySelector(".banner-icon-error"), kind !== "error");
    setHidden(banner.querySelector(".banner-icon-info"), kind !== "info");
    banner.querySelector(".banner-text").textContent = text;
  }
  function hideBanner(form) { form.querySelector(".banner").hidden = true; }

  try {
    var params = new URLSearchParams(window.location.search);
    var notice = params.get("notice");
    if (notice === "douyin-session-required") {
      showBanner(loginForm, "info", "登录状态已失效，请重新登录后再次发起授权。");
    }
  } catch (_) { /* 未识别的提示参数保持静默 */ }

  /* ---- 视图切换 ---- */
  function clearForm(form) {
    hideBanner(form);
    Array.prototype.forEach.call(form.querySelectorAll(".field input"), function (input) {
      setFieldError(input, "");
    });
  }
  function stopCountdowns() {
    countdowns.forEach(function (stop) { stop(); });
    countdowns = [];
  }
  function showView(name) {
    stopCountdowns();
    Object.keys(forms).forEach(function (key) {
      clearForm(forms[key]);
      forms[key].hidden = key !== name;
    });
    title.textContent = TITLES[name];
    if (name === "reset") {
      resetToken = "";
      resetStep1.hidden = false;
      resetStep2.hidden = true;
      byId("reset-password").value = "";
      forms.reset.querySelector(".submit-text").textContent = "验 证";
      byId("reset-phone").focus();
    } else if (name === "register") {
      byId("reg-username").focus();
    } else {
      (loginByCode ? byId("login-phone") : usernameInput).focus();
    }
  }
  byId("forgot-btn").addEventListener("click", function () { showView("reset"); });
  byId("to-register").addEventListener("click", function () { showView("register"); });
  Array.prototype.forEach.call(document.querySelectorAll(".to-login"), function (button) {
    button.addEventListener("click", function () { showView("login"); });
  });
  loginModeToggle.addEventListener("click", function () {
    loginByCode = !loginByCode;
    clearForm(loginForm);
    stopCountdowns();
    pwBlock.hidden = loginByCode;
    codeBlock.hidden = !loginByCode;
    loginModeToggle.textContent = loginByCode ? "密码登录" : "验证码登录";
    (loginByCode ? byId("login-phone") : usernameInput).focus();
  });

  /* 自动聚焦账号框（autofocus 属性在部分浏览器的 bfcache 恢复后失效，这里兜底） */
  window.addEventListener("load", function () {
    if (!usernameInput.value) usernameInput.focus();
  });

  /* ---- 请求 ---- */
  function returnToParam() {
    try {
      var params = new URLSearchParams(window.location.search);
      var value = params.get("return_to") || params.get("rd") || "";
      if (value && value.charAt(0) === "/" && value.charAt(1) !== "/") return value;
    } catch (_) { /* 忽略解析异常 */ }
    return "";
  }
  function redirectTarget() {
    return returnToParam() || REDIRECT_FALLBACK;
  }
  function postForm(marker, body) {
    return fetch(BASE_PATH + ENDPOINTS[marker], {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-Dcar-Request": marker
      },
      body: body.toString(),
      credentials: "include"
    }).then(function (response) {
      return response.json().catch(function () { return null; }).then(function (data) {
        return { response: response, data: data };
      });
    });
  }
  function detailOf(result, fallback) {
    var detail = result.data && typeof result.data.detail === "string" ? result.data.detail : "";
    return detail || fallback;
  }
  function goTo(result) {
    var target = result.data && typeof result.data.redirect_to === "string" && result.data.redirect_to.charAt(0) === "/"
      ? result.data.redirect_to
      : redirectTarget();
    window.location.replace(target);
  }
  function setLoading(form, loading, idleText, busyText) {
    var button = form.querySelector(".submit");
    form.dataset.submitting = loading ? "1" : "";
    button.disabled = loading;
    button.classList.toggle("loading", loading);
    button.querySelector(".submit-text").textContent = loading ? busyText : idleText;
  }
  function previewOnly(form) {
    setLoading(form, true, "", "处理中…");
    window.setTimeout(function () {
      setLoading(form, false, form === loginForm ? "登 录" : form.querySelector(".submit-text").textContent, "");
      showBanner(form, "info", "这是登录页的样式预览，无法在这里操作。请打开线上地址后再试。");
    }, 900);
  }

  /* ---- 获取验证码：60 秒倒计时即反馈，不额外提示 ---- */
  function startCountdown(button) {
    var remaining = COUNTDOWN_SECONDS;
    button.disabled = true;
    button.textContent = remaining + "s";
    var timer = window.setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        stop();
        return;
      }
      button.textContent = remaining + "s";
    }, 1000);
    function stop() {
      window.clearInterval(timer);
      button.disabled = false;
      button.textContent = "重新获取";
    }
    countdowns.push(function () {
      window.clearInterval(timer);
      button.disabled = false;
      button.textContent = "获取验证码";
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".code-btn"), function (button) {
    button.addEventListener("click", function () {
      var form = button.closest("form");
      var phoneInput = byId(button.getAttribute("data-phone"));
      hideBanner(form);
      if (!requireValue(phoneInput, "请输入手机号", PHONE_PATTERN, "手机号格式不正确")) {
        phoneInput.focus();
        return;
      }
      if (IS_PREVIEW) { startCountdown(button); return; }
      button.disabled = true;
      var body = new URLSearchParams();
      body.set("phone", phoneInput.value.trim());
      body.set("purpose", button.getAttribute("data-purpose"));
      postForm("code", body).then(function (result) {
        if (result.response.ok) {
          startCountdown(button);
          var codeInput = button.parentNode.querySelector("input");
          if (codeInput) codeInput.focus();
          return;
        }
        button.disabled = false;
        if (result.response.status === 404 || result.response.status === 405) {
          showBanner(form, "error", "验证码服务尚未就绪，请联系管理员更新登录服务。");
          return;
        }
        showBanner(form, "error", detailOf(result, "验证码发送失败，请稍后重试") + "。");
      }).catch(function () {
        button.disabled = false;
        showBanner(form, "error", "无法连接到服务器，请检查网络后重试。");
      });
    });
  });

  /* ---- 登录 ---- */
  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    if (loginForm.dataset.submitting) return;
    hideBanner(loginForm);
    var body = new URLSearchParams();
    if (loginByCode) {
      var phoneInput = byId("login-phone");
      var codeInput = byId("login-code");
      var okPhone = requireValue(phoneInput, "请输入手机号", PHONE_PATTERN, "手机号格式不正确");
      var okCode = requireValue(codeInput, "请输入验证码", CODE_PATTERN, "验证码为 6 位数字");
      if (!okPhone || !okCode) { firstInvalid([phoneInput, codeInput]).focus(); return; }
      body.set("phone", phoneInput.value.trim());
      body.set("code", codeInput.value.trim());
    } else {
      var okUser = requireValue(usernameInput, "请输入账号");
      var okPassword = requireValue(passwordInput, "请输入密码");
      if (!okUser || !okPassword) { firstInvalid([usernameInput, passwordInput]).focus(); return; }
      body.set("username", usernameInput.value.trim());
      body.set("password", passwordInput.value);
    }
    if (IS_PREVIEW) { previewOnly(loginForm); return; }
    body.set("remember", byId("remember").checked ? "1" : "0");
    body.set("return_to", returnToParam());
    setLoading(loginForm, true, "登 录", "登录中…");
    postForm(loginByCode ? "login-code" : "login", body).then(function (result) {
      var response = result.response;
      if (response.ok) { goTo(result); return; }
      setLoading(loginForm, false, "登 录", "");
      var detail = detailOf(result, "");
      if (response.status === 401) {
        if (loginByCode) {
          showBanner(loginForm, "error", (detail || "验证码不正确或已失效") + "。");
          byId("login-code").focus();
          byId("login-code").select();
        } else {
          showBanner(loginForm, "error", (detail || "账号或密码不正确") + "，请检查后重试。");
          passwordInput.focus();
          passwordInput.select();
        }
      } else if (response.status === 429) {
        showBanner(loginForm, "error", detail ? detail + "。" : "尝试次数太多，请稍后再登录。");
      } else if (response.status === 403) {
        showBanner(loginForm, "error", detail ? detail + "。" : "登录页面已失效，请刷新后重新登录。");
      } else if (response.status === 413) {
        showBanner(loginForm, "error", detail ? detail + "。" : "登录信息太长，请刷新页面后重新输入。");
      } else {
        showBanner(loginForm, "error", "暂时无法登录，请稍后重试。");
      }
    }).catch(function () {
      setLoading(loginForm, false, "登 录", "");
      showBanner(loginForm, "error", "无法连接到服务器，请检查网络后重试。");
    });
  });

  /* ---- 注册 ---- */
  forms.register.addEventListener("submit", function (event) {
    event.preventDefault();
    var form = forms.register;
    if (form.dataset.submitting) return;
    hideBanner(form);
    var inputs = [byId("reg-username"), byId("reg-phone"), byId("reg-password"), byId("reg-code")];
    var ok = requireValue(inputs[0], "请输入账号名称", USERNAME_PATTERN, "账号为 4–32 位字母、数字或下划线");
    ok = requireValue(inputs[1], "请输入手机号", PHONE_PATTERN, "手机号格式不正确") && ok;
    ok = requirePassword(inputs[2]) && ok;
    ok = requireValue(inputs[3], "请输入验证码", CODE_PATTERN, "验证码为 6 位数字") && ok;
    if (!ok) { firstInvalid(inputs).focus(); return; }
    if (IS_PREVIEW) { previewOnly(form); return; }
    var body = new URLSearchParams();
    body.set("username", inputs[0].value.trim());
    body.set("phone", inputs[1].value.trim());
    body.set("password", inputs[2].value);
    body.set("code", inputs[3].value.trim());
    body.set("return_to", returnToParam());
    setLoading(form, true, "完成注册并登录", "注册中…");
    postForm("register", body).then(function (result) {
      if (result.response.ok) { goTo(result); return; }
      setLoading(form, false, "完成注册并登录", "");
      showBanner(form, "error", detailOf(result, "暂时无法注册，请稍后重试") + "。");
      if (result.response.status === 401) { inputs[3].focus(); inputs[3].select(); }
    }).catch(function () {
      setLoading(form, false, "完成注册并登录", "");
      showBanner(form, "error", "无法连接到服务器，请检查网络后重试。");
    });
  });

  /* ---- 找回密码：先验证码，再新密码 ---- */
  forms.reset.addEventListener("submit", function (event) {
    event.preventDefault();
    var form = forms.reset;
    if (form.dataset.submitting) return;
    hideBanner(form);
    if (!resetToken) {
      var phoneInput = byId("reset-phone");
      var codeInput = byId("reset-code");
      var okPhone = requireValue(phoneInput, "请输入手机号", PHONE_PATTERN, "手机号格式不正确");
      var okCode = requireValue(codeInput, "请输入验证码", CODE_PATTERN, "验证码为 6 位数字");
      if (!okPhone || !okCode) { firstInvalid([phoneInput, codeInput]).focus(); return; }
      if (IS_PREVIEW) { previewOnly(form); return; }
      var verifyBody = new URLSearchParams();
      verifyBody.set("phone", phoneInput.value.trim());
      verifyBody.set("code", codeInput.value.trim());
      setLoading(form, true, "验 证", "验证中…");
      postForm("reset-verify", verifyBody).then(function (result) {
        if (result.response.ok && result.data && typeof result.data.reset_token === "string") {
          resetToken = result.data.reset_token;
          stopCountdowns();
          resetStep1.hidden = true;
          resetStep2.hidden = false;
          setLoading(form, false, "确认修改并登录", "");
          byId("reset-password").focus();
          return;
        }
        setLoading(form, false, "验 证", "");
        showBanner(form, "error", detailOf(result, "验证码不正确或已失效") + "。");
        codeInput.focus();
        codeInput.select();
      }).catch(function () {
        setLoading(form, false, "验 证", "");
        showBanner(form, "error", "无法连接到服务器，请检查网络后重试。");
      });
      return;
    }
    var passwordField = byId("reset-password");
    if (!requirePassword(passwordField)) { passwordField.focus(); return; }
    var confirmBody = new URLSearchParams();
    confirmBody.set("reset_token", resetToken);
    confirmBody.set("password", passwordField.value);
    confirmBody.set("return_to", returnToParam());
    setLoading(form, true, "确认修改并登录", "提交中…");
    postForm("reset-confirm", confirmBody).then(function (result) {
      if (result.response.ok) { goTo(result); return; }
      setLoading(form, false, "确认修改并登录", "");
      showBanner(form, "error", detailOf(result, "验证已失效，请重新获取验证码") + "。");
      if (result.response.status === 401) {
        resetToken = "";
        resetStep1.hidden = false;
        resetStep2.hidden = true;
        form.querySelector(".submit-text").textContent = "验 证";
        byId("reset-code").value = "";
        byId("reset-code").focus();
      }
    }).catch(function () {
      setLoading(form, false, "确认修改并登录", "");
      showBanner(form, "error", "无法连接到服务器，请检查网络后重试。");
    });
  });
</script>
</body>
</html>
