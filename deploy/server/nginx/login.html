<!DOCTYPE html>
<!--
  ============================================================================
  Dcar Sentinel · 登录页（纯页面 + UI，不包含任何账号验证逻辑）
  ============================================================================
  已接线：本页是 dcar_auth.gateway（src/dcar_eval/dcar_auth/gateway.py）的
  登录模板。网关把本页挂在 <base>/login（本地 base 为空 → /login；服务器
  设 DCAR_AUTH_BASE_PATH=/dcar → /dcar/login），页面从自身地址推导 base，
  两种形态无需改动。

  网关合同：
    - POST <base>/auth/login，表单 username/password/remember/return_to，
      必须携带请求头 X-Dcar-Request: login（同源校验）
    - 成功返回 200 JSON {"redirect_to": 路径}，页面按其跳转
    - 失败返回 JSON {"detail": 中文提示}（401/403/413/429/503），页面优先展示
    - 会话探活 GET <base>/auth/session（已登录 200，未登录 401）
    - 未登录访问受保护页 → 302 <base>/login?return_to=<原路径>

  直接以 file:// 打开 → 自动进入本地预览模式，不发送任何数据。
  账号密码由网关校验 runtime/auth/users.htpasswd（$6$ sha512_crypt，
  由 scripts/create_local_auth_user.py 创建）；本页面只负责界面与提交。
  设计令牌与 app/web/app/globals.css 保持一致（navy/#102c35、品牌黄/#ffcd32、
  荧光绿/#d9ff57、teal/#0d8a7b、ink/#13262d）。
  ============================================================================
-->

<style>
  :root {
    --ink: #13262d;
    --muted: #68777d;
    --line: #dfe6e8;
    --paper: #ffffff;
    --navy: #102c35;
    --navy-2: #173e48;
    --dcd-brand: #ffcd32;
    --dcd-on-brand: #1f2129;
    --lime: #d9ff57;
    --teal: #0d8a7b;
    --teal-soft: #e3f3ef;
    --orange: #e4743b;
    --red: #c84c4c;
    --red-soft: #fdecec;
    --focus-ring: 0 0 0 4px rgba(13, 138, 123, .16);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 82% 12%, rgba(217, 255, 87, .2), transparent 33%),
      radial-gradient(circle at 8% 92%, rgba(13, 138, 123, .22), transparent 34%),
      linear-gradient(130deg, var(--navy) 0%, #143540 52%, var(--navy-2) 100%);
    background-attachment: fixed;
  }
  button, input { font: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

  /* 背景网格点缀：极淡，向中心渐隐 */
  .stage::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, transparent 26%, #000 78%);
            mask-image: radial-gradient(circle at 50% 42%, transparent 26%, #000 78%);
    pointer-events: none;
  }

  .stage {
    min-height: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 40px 20px calc(26px + env(safe-area-inset-bottom));
  }

  /* ---- 登录卡片 ---- */
  .card {
    position: relative;
    width: min(420px, 100%);
    padding: 38px 42px 32px;
    border-radius: 18px;
    background: var(--paper);
    box-shadow: 0 24px 70px rgba(4, 16, 21, .45), 0 2px 8px rgba(4, 16, 21, .25);
    animation: card-in .45s cubic-bezier(.22, .8, .3, 1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .brand-mark {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 11px;
    box-shadow: 0 4px 14px rgba(31, 33, 41, .22);
  }
  .brand strong { display: block; font-size: 16px; letter-spacing: .2px; }
  .brand span   { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .preview-badge {
    margin-left: auto;
    align-self: flex-start;
    padding: 4px 8px;
    border: 1px solid #f2ddb0;
    border-radius: 999px;
    background: #fdf6e3;
    color: #9a6b1f;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
  }

  .welcome h1 { margin: 0; font-size: 22px; letter-spacing: -.4px; }
  .welcome p  { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

  form { margin-top: 24px; }

  .field { margin-bottom: 16px; }
  .label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .field label {
    display: inline-block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 750;
    color: #3c4f56;
  }
  .hint-link {
    border: 0; padding: 0;
    background: transparent;
    color: var(--teal);
    font-size: 11px;
    font-weight: 750;
  }
  .hint-link:hover { text-decoration: underline; }
  .hint-link:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 3px; }

  .control { position: relative; }
  .control .lead-icon {
    position: absolute;
    left: 13px; top: 50%;
    width: 17px; height: 17px;
    transform: translateY(-50%);
    color: #93a1a6;
    pointer-events: none;
  }
  .control input {
    width: 100%;
    height: 46px;
    padding: 0 44px 0 40px;
    border: 1px solid #cad5d8;
    border-radius: 10px;
    outline: none;
    background: #fbfcfc;
    color: var(--ink);
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .control input::placeholder { color: #9fadb2; }
  .control input:hover { border-color: #adbcc0; }
  .control input:focus {
    border-color: var(--teal);
    background: #fff;
    box-shadow: var(--focus-ring);
  }
  .field.invalid .control input { border-color: var(--red); background: #fffbfb; }
  .field.invalid .control input:focus { box-shadow: 0 0 0 4px rgba(200, 76, 76, .13); }
  #username { padding-right: 14px; }

  .pw-toggle {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    display: grid; place-items: center;
    width: 34px; height: 34px;
    border: 0; border-radius: 8px;
    background: transparent;
    color: #8b999e;
    transition: background .15s ease, color .15s ease;
  }
  .pw-toggle:hover { background: #eef2f3; color: #4a5c62; }
  .pw-toggle:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .pw-toggle svg { width: 19px; height: 19px; }

  .field-msg {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    margin: 7px 2px 0;
    font-size: 11px;
    line-height: 1.5;
  }
  .field-msg svg { width: 13px; height: 13px; flex: 0 0 13px; margin-top: 1px; }
  .field-msg.error { color: #b04a4a; }
  .field-msg.caps  { color: #b05f2e; }
  [hidden] { display: none !important; }

  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 0 18px;
  }
  .remember {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #4a5c62;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    user-select: none;
  }
  .remember input {
    width: 17px; height: 17px;
    margin: 0;
    accent-color: var(--navy);
    cursor: pointer;
  }
  .remember input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---- 全局提示条（错误 / 信息）---- */
  .banner {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 0 16px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.6;
  }
  .banner svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 1px; }
  .banner.error { background: var(--red-soft); border: 1px solid #f0cfcf; color: #a74343; }
  .banner.info  { background: #edf8f5; border: 1px solid #bfded7; color: #176e63; }

  .submit {
    position: relative;
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--navy);
    border-radius: 10px;
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 750;
    letter-spacing: 2px;
    box-shadow: 0 7px 18px rgba(16, 44, 53, .28);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .submit:hover { transform: translateY(-1px); background: #16414f; box-shadow: 0 9px 22px rgba(16, 44, 53, .34); }
  .submit:active { transform: none; }
  .submit:focus-visible { outline: 3px solid rgba(13, 138, 123, .55); outline-offset: 2px; }
  .submit:disabled { cursor: not-allowed; opacity: .72; transform: none; box-shadow: none; }
  .submit .spinner {
    display: none;
    width: 16px; height: 16px;
    margin-right: 9px;
    vertical-align: -3px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .submit.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .secure-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid #edf1f2;
    color: #8b999e;
    font-size: 11px;
  }
  .secure-note svg { width: 13px; height: 13px; color: var(--teal); }

  .page-foot {
    color: #8eabb2;
    font-size: 11px;
    letter-spacing: .3px;
    text-align: center;
  }
  .page-foot .dot { margin: 0 7px; opacity: .55; }

  @media (max-width: 480px) {
    .stage { padding: 28px 16px calc(20px + env(safe-area-inset-bottom)); gap: 20px; }
    .card { padding: 30px 24px 26px; border-radius: 16px; }
    .welcome h1 { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .submit, .control input, .pw-toggle { transition: none; }
    .submit .spinner { animation-duration: 1.4s; }
  }
</style>
</head>

<script>
  "use strict";
  /* ==========================================================================
     接线：dcar_auth.gateway 合同（见文件头注释）。
     登录页固定挂在 <base>/login，据此从自身地址推导 base——
     本地 http://127.0.0.1:4173/login → base ""；
     服务器 https://<host>/dcar/login → base "/dcar"。
     以 file:// 直接打开本文件时自动进入预览模式：不发送任何请求，仅演示状态。
     ========================================================================== */
  var IS_PREVIEW = window.location.protocol === "file:";
  var BASE_PATH = IS_PREVIEW ? "" : window.location.pathname.replace(/\/login\/?$/, "");
  var LOGIN_ENDPOINT = IS_PREVIEW ? null : BASE_PATH + "/auth/login";
  var SESSION_PROBE_ENDPOINT = IS_PREVIEW ? null : BASE_PATH + "/auth/session";
  var REDIRECT_FALLBACK = BASE_PATH + "/overview";

  var form = document.getElementById("login-form");
  var usernameInput = document.getElementById("username");
  var passwordInput = document.getElementById("password");
  var usernameField = document.getElementById("username-field");
  var passwordField = document.getElementById("password-field");
  var usernameError = document.getElementById("username-error");
  var passwordError = document.getElementById("password-error");
  var capsHint = document.getElementById("caps-hint");
  var banner = document.getElementById("banner");
  var bannerText = document.getElementById("banner-text");
  var bannerIconError = document.getElementById("banner-icon-error");
  var bannerIconInfo = document.getElementById("banner-icon-info");
  var submitBtn = document.getElementById("submit-btn");
  var submitText = document.getElementById("submit-text");
  var pwToggle = document.getElementById("pw-toggle");
  var eyeOpen = document.getElementById("eye-open");
  var eyeClosed = document.getElementById("eye-closed");
  var forgotBtn = document.getElementById("forgot-btn");

  /* SVG 元素没有 HTMLElement 的 hidden 属性接口，统一用 attribute 切换显隐 */
  function setHidden(element, hidden) {
    if (hidden) element.setAttribute("hidden", "");
    else element.removeAttribute("hidden");
  }

  /* 自动聚焦账号框（autofocus 属性在部分浏览器的 bfcache 恢复后失效，这里兜底） */
  window.addEventListener("load", function () {
    if (!usernameInput.value) usernameInput.focus();
  });

  /* 以 file:// 直接打开时亮出"本地预览"角标，避免误以为是正式登录入口 */
  if (IS_PREVIEW) {
    document.getElementById("preview-badge").removeAttribute("hidden");
  }

  /* 已持有有效会话时直接进入工作台（网关在服务端也会做同样的跳转，这里
     兜底 bfcache/回退按钮场景）；探活失败则静默停留在登录页 */
  if (SESSION_PROBE_ENDPOINT) {
    fetch(SESSION_PROBE_ENDPOINT, { credentials: "include", cache: "no-store" })
      .then(function (response) {
        if (response.ok) window.location.replace(redirectTarget());
      })
      .catch(function () { /* 保持在登录页 */ });
  }

  /* ---- 显示 / 隐藏密码：不抢占输入框焦点 ---- */
  pwToggle.addEventListener("mousedown", function (event) { event.preventDefault(); });
  pwToggle.addEventListener("click", function () {
    var show = passwordInput.type === "password";
    passwordInput.type = show ? "text" : "password";
    pwToggle.setAttribute("aria-pressed", String(show));
    pwToggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
    setHidden(eyeOpen, show);
    setHidden(eyeClosed, !show);
  });

  /* ---- 大写锁定提示 ---- */
  function updateCapsHint(event) {
    if (typeof event.getModifierState !== "function") return;
    capsHint.hidden = !event.getModifierState("CapsLock");
  }
  passwordInput.addEventListener("keydown", updateCapsHint);
  passwordInput.addEventListener("keyup", updateCapsHint);
  passwordInput.addEventListener("blur", function () { capsHint.hidden = true; });

  /* ---- 字段校验：仅前端必填检查，输入后即时恢复 ---- */
  function setFieldInvalid(field, message, invalid) {
    field.classList.toggle("invalid", invalid);
    message.hidden = !invalid;
  }
  usernameInput.addEventListener("input", function () {
    if (usernameInput.value.trim()) setFieldInvalid(usernameField, usernameError, false);
  });
  passwordInput.addEventListener("input", function () {
    if (passwordInput.value) setFieldInvalid(passwordField, passwordError, false);
  });

  /* ---- 顶部提示条 ---- */
  function showBanner(kind, text) {
    banner.hidden = false;
    banner.className = "banner " + kind;
    setHidden(bannerIconError, kind !== "error");
    setHidden(bannerIconInfo, kind !== "info");
    bannerText.textContent = text;
  }
  function hideBanner() { banner.hidden = true; }

  forgotBtn.addEventListener("click", function () {
    showBanner("info", "本系统密码由管理员统一管理，如需重置请联系管理员。");
  });

  /* ---- 提交 ---- */
  var submitting = false;
  function setLoading(loading) {
    submitting = loading;
    submitBtn.disabled = loading;
    submitBtn.classList.toggle("loading", loading);
    submitText.textContent = loading ? "登录中…" : "登 录";
  }

  function returnToParam() {
    try {
      var params = new URLSearchParams(window.location.search);
      var value = params.get("return_to") || params.get("rd") || "";
      if (value && value.charAt(0) === "/" && value.charAt(1) !== "/") return value;
    } catch (_) { /* 忽略解析异常 */ }
    return "";
  }

  function redirectTarget() {
    return returnToParam() || REDIRECT_FALLBACK;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (submitting) return;
    hideBanner();

    var hasUsername = Boolean(usernameInput.value.trim());
    var hasPassword = Boolean(passwordInput.value);
    setFieldInvalid(usernameField, usernameError, !hasUsername);
    setFieldInvalid(passwordField, passwordError, !hasPassword);
    if (!hasUsername || !hasPassword) {
      (!hasUsername ? usernameInput : passwordInput).focus();
      return;
    }

    /* 本地预览：不发送任何数据，仅演示加载与提示状态 */
    if (!LOGIN_ENDPOINT) {
      setLoading(true);
      window.setTimeout(function () {
        setLoading(false);
        showBanner("info", "本地预览：直接打开文件只能查看样式，不会发送数据。正式登录请访问服务器上的 /dcar/（部署完成后自动跳转到本登录页）。");
      }, 900);
      return;
    }

    /* 真实提交：网关校验 htpasswd 并签发会话 Cookie，成功后按其返回跳转 */
    setLoading(true);
    var body = new URLSearchParams();
    body.set("username", usernameInput.value.trim());
    body.set("password", passwordInput.value);
    body.set("remember", document.getElementById("remember").checked ? "1" : "0");
    body.set("return_to", returnToParam());

    fetch(LOGIN_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-Dcar-Request": "login"
      },
      body: body.toString(),
      credentials: "include"
    }).then(function (response) {
      return response.json().catch(function () { return null; }).then(function (data) {
        if (response.ok) {
          var target = data && typeof data.redirect_to === "string" && data.redirect_to.charAt(0) === "/"
            ? data.redirect_to
            : redirectTarget();
          window.location.replace(target);
          return;
        }
        setLoading(false);
        var detail = data && typeof data.detail === "string" ? data.detail : "";
        if (response.status === 401) {
          showBanner("error", (detail || "账号或密码不正确") + "，请检查后重试。");
          passwordInput.focus();
          passwordInput.select();
        } else if (response.status === 429) {
          showBanner("error", detail ? detail + "。" : "尝试次数过多，登录已被暂时锁定，请稍后再试。");
        } else if (response.status === 403) {
          showBanner("error", detail ? detail + "，请刷新页面后重试。" : "请求来源校验未通过，请刷新页面后重试。");
        } else {
          showBanner("error", detail ? detail + "（" + response.status + "）。" : "登录服务暂时不可用（" + response.status + "），请稍后重试。");
        }
      });
    }).catch(function () {
      setLoading(false);
      showBanner("error", "无法连接到服务器，请检查网络后重试。");
    });
  });
</script>
</body>
</html>
