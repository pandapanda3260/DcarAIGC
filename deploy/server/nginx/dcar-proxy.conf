# Public Dcar Sentinel path. The authentication gateway on 127.0.0.1:4173 is
# the only browser-facing upstream: it owns login/session/logout and forwards
# authenticated Web requests to 4174 and API requests to 8765.

location = /dcar {
    return 308 /dcar/;
}

location ^~ /dcar/ {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    # $http_host, not $host: the gateway checks the browser Origin header
    # against X-Forwarded-Proto://X-Forwarded-Host, and Origin keeps the port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header X-Dcar-Authenticated-User "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}
