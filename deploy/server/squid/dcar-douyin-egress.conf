# Dedicated CONNECT-only egress for the Douyin control service.
# Keep the destination exact: subdomains and IP literals are intentionally denied.
http_port 127.0.0.1:4176
visible_hostname dcar-douyin-egress
pid_filename /run/dcar-douyin-egress/squid.pid

acl CONNECT method CONNECT
acl TLS_port port 443
acl douyin_openapi dstdomain -n open.douyin.com

http_access deny !localhost
http_access deny !CONNECT
http_access deny !TLS_port
http_access allow localhost CONNECT douyin_openapi TLS_port
http_access deny all

# Tunnels are never cached and request metadata is not retained on disk.
cache deny all
cache_mem 0 KB
maximum_object_size 0 KB
access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0

forwarded_for delete
httpd_suppress_version_string on
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 2 minutes
shutdown_lifetime 1 seconds
