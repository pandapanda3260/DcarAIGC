# Install as /etc/ssh/sshd_config.d/60-dcar-douyin-sync.conf and validate with
# sshd -t before reload. The account shell and forced command deny sessions;
# ssh -N can still open the single permitted direct-tcpip channel.
Match User dcar-douyin-sync
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:4175
    GatewayPorts no
    PermitTunnel no
    ForceCommand /usr/sbin/nologin

Match all
